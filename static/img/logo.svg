<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="50%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="scoopPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="scoopPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="scoopMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado -->
  <rect width="240" height="240" rx="44" fill="url(#bgGrad)" stroke="#f9a8d4" stroke-width="4"/>

  <!-- Brilhos / Estrelas Mágicas -->
  <path d="M46 42 L50 54 L62 58 L50 62 L46 74 L42 62 L30 58 L42 54 Z" fill="#f59e0b"/>
  <path d="M194 38 L197 48 L207 51 L197 54 L194 64 L191 54 L181 51 L191 48 Z" fill="#ec4899"/>
  <circle cx="185" cy="115" r="5" fill="#fbbf24"/>
  <circle cx="52" cy="120" r="4" fill="#a855f7"/>

  <!-- Bola Esquerda (Menta) -->
  <circle cx="92" cy="96" r="32" fill="url(#scoopMint)"/>
  <!-- Bola Direita (Uva / Mirtilo) -->
  <circle cx="148" cy="96" r="32" fill="url(#scoopPurple)"/>
  <!-- Bola Central Topo (Morango / Framboesa) -->
  <circle cx="120" cy="68" r="36" fill="url(#scoopPink)"/>

  <!-- Calda de Chocolate / Morango no Topo -->
  <path d="M90 62 Q105 82 112 68 Q120 88 130 67 Q140 82 150 62 A36 36 0 0 0 90 62 Z" fill="#831843" opacity="0.35"/>

  <!-- Cereja no Topo -->
  <path d="M120 32 Q132 14 148 16" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="34" r="10" fill="#e11d48"/>
  <circle cx="117" cy="31" r="3" fill="#fecdd3"/>

  <!-- Granulados Coloridos -->
  <rect x="106" y="54" width="8" height="4" rx="2" transform="rotate(-25 106 54)" fill="#fef08a"/>
  <rect x="128" y="58" width="8" height="4" rx="2" transform="rotate(20 128 58)" fill="#ffffff"/>
  <rect x="115" y="74" width="8" height="4" rx="2" transform="rotate(10 115 74)" fill="#5eead4"/>
  <rect x="82" y="92" width="7" height="3.5" rx="2" transform="rotate(-15 82 92)" fill="#ffffff"/>
  <rect x="150" y="90" width="7" height="3.5" rx="2" transform="rotate(30 150 90)" fill="#fde047"/>

  <!-- Casquinha (Cone) -->
  <polygon points="78,112 162,112 120,214" fill="url(#coneGrad)" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
  <!-- Textura de Waffle da Casquinha -->
  <line x1="92" y1="112" x2="132" y2="184" stroke="#78350f" stroke-width="2" opacity="0.35"/>
  <line x1="115" y1="112" x2="144" y2="156" stroke="#78350f" stroke-width="2" opacity="0.35"/>
  <line x1="148" y1="112" x2="108" y2="184" stroke="#78350f" stroke-width="2" opacity="0.35"/>
  <line x1="125" y1="112" x2="96" y2="156" stroke="#78350f" stroke-width="2" opacity="0.35"/>

  <!-- Borda Ondulada do Creme sobre a Casquinha -->
  <path d="M72 112 Q84 124 96 112 Q108 124 120 112 Q132 124 144 112 Q156 124 168 112" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
</svg>
